<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CS 201 Fan Club</title>
    <style>
        body {
            font-family: serif;
            margin: 40px;
        }
        h2 {
            font-size: 28px;
        }
        hr {
            border: none;
            border-top: 1px solid #d3d3d3;
            margin: 10px 0 20px 0;
        }
        ul {
            list-style-type: disc;
        }
        /* تمرين الـ outline بخلفية صفراء */
        .yellow-bg {
            background-color: yellow;
            padding: 2px 0;
        }
        .underlined {
            text-decoration: underline;
        }
        .superFun {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>CS 201 Fan Club</h2>
    <hr />
    <div>
        Top three reasons to love CS 201 Client-Side Web Programming:
    </div>
    
    <ul>
        <li><span class="yellow-bg"><span class="underlined">Exciting</span> lectures</span></li>
        <li><span class="yellow-bg"><span class="superFun">Super-fun</span> homework assignments</span></li>
        <li><span class="yellow-bg">Excellent exams</span></li>
    </ul>

</body>
</html>
